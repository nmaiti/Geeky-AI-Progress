name: Setup Hooks Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: shellcheck setup-hooks.sh

      - name: Bash Syntax Check
        run: bash -n setup-hooks.sh
