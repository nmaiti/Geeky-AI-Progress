name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-monitor:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary_name: monitor-server-linux-amd64
          - goos: windows
            goarch: amd64
            binary_name: monitor-server-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        run: |
          cd Monitor_sever
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o ${{ matrix.binary_name }} .

      - name: Generate checksum
        run: |
          cd Monitor_sever
          sha256sum ${{ matrix.binary_name }} > ${{ matrix.binary_name }}.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: |
            Monitor_sever/${{ matrix.binary_name }}
            Monitor_sever/${{ matrix.binary_name }}.sha256

  build-esp8266:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache PlatformIO packages & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            Nodemcu_8266/.pio
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('Nodemcu_8266/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Build ESP8266 Firmware via Docker
        run: |
          cd Nodemcu_8266
          docker run --rm \
            -v "$(pwd):/workspace" \
            -w /workspace \
            infinitecoding/platformio-for-ci:latest \
            platformio run

      - name: Upload ESP8266 Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp8266-firmware
          path: |
            Nodemcu_8266/.pio/build/nodemcuv2/firmware.bin
            Nodemcu_8266/.pio/build/nodemcuv2/firmware.elf

  release:
    needs: [build-monitor, build-esp8266]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Prepare setup-hooks.sh
        run: |
          mkdir -p ./release-files
          cp setup-hooks.sh ./release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/**/*
            ./release-files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
